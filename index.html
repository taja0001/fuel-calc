<title>Fill-Up — cheapest forecourt by true cost</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    color-scheme: light dark;
    --ground:#f4f1ea; --panel:#fff; --panel-2:#faf7f0; --ink:#221d16; --ink-soft:#6b6154;
    --hair:#e4ddd0; --hair-strong:#d3c9b7; --amber:#b8720a; --amber-glow:#d98a12;
    --go:#1f8a4c; --go-soft:#e7f3ec; --warn:#b45309;
    --shadow:0 1px 2px rgba(34,29,22,.06),0 12px 28px rgba(34,29,22,.10);
    --readout-bg:#16130f; --readout-ink:#ffb020; --readout-dim:rgba(255,176,32,.30);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#141210; --panel:#201c17; --panel-2:#1a1712; --ink:#f2ece1; --ink-soft:#a89c89;
      --hair:#322c24; --hair-strong:#423a30; --amber:#ffb020; --amber-glow:#ffc247;
      --go:#4fd188; --go-soft:#16271d; --warn:#e0a54a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 34px rgba(0,0,0,.5);
      --readout-bg:#0c0a07; --readout-ink:#ffb020; --readout-dim:rgba(255,176,32,.24);
    }
  }
  :root[data-theme="light"]{color-scheme:light;--ground:#f4f1ea;--panel:#fff;--panel-2:#faf7f0;--ink:#221d16;--ink-soft:#6b6154;--hair:#e4ddd0;--hair-strong:#d3c9b7;--amber:#b8720a;--amber-glow:#d98a12;--go:#1f8a4c;--go-soft:#e7f3ec;--warn:#b45309;--shadow:0 1px 2px rgba(34,29,22,.06),0 12px 28px rgba(34,29,22,.10);--readout-bg:#16130f;--readout-ink:#ffb020;--readout-dim:rgba(255,176,32,.30);}
  :root[data-theme="dark"]{color-scheme:dark;--ground:#141210;--panel:#201c17;--panel-2:#1a1712;--ink:#f2ece1;--ink-soft:#a89c89;--hair:#322c24;--hair-strong:#423a30;--amber:#ffb020;--amber-glow:#ffc247;--go:#4fd188;--go-soft:#16271d;--warn:#e0a54a;--shadow:0 1px 2px rgba(0,0,0,.4),0 16px 34px rgba(0,0,0,.5);--readout-bg:#0c0a07;--readout-ink:#ffb020;--readout-dim:rgba(255,176,32,.24);}

  *{box-sizing:border-box;}
  body{margin:0;background:var(--ground);color:var(--ink);line-height:1.5;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:600px;margin:0 auto;padding:26px 16px 72px;}

  header{text-align:center;margin-bottom:20px;}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:8px;}
  .badge .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber-glow);}
  h1{font-size:28px;margin:0;letter-spacing:-.02em;text-wrap:balance;}
  .tag{color:var(--ink-soft);font-size:14px;margin-top:4px;}

  .readout{background:var(--readout-bg);border-radius:var(--radius);padding:20px;margin:18px 0;
    box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,176,32,.12);position:relative;overflow:hidden;}
  .readout::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
    background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(0,0,0,.14) 3px 4px);}
  .readout .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--readout-dim);font-weight:700;}
  .readout .total{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:clamp(40px,13vw,60px);
    font-weight:700;line-height:1;color:var(--readout-ink);font-variant-numeric:tabular-nums;
    text-shadow:0 0 18px rgba(255,176,32,.35);margin:8px 0 4px;}
  .readout .where{color:var(--readout-ink);font-size:16px;font-weight:600;}
  .readout .sub{font-family:ui-monospace,Menlo,monospace;color:var(--readout-dim);font-size:12px;
    font-variant-numeric:tabular-nums;margin-top:6px;}

  .card{background:var(--panel);border:1px solid var(--hair);border-radius:var(--radius);
    padding:16px 16px 18px;box-shadow:var(--shadow);margin-bottom:14px;}
  .card h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
    margin:0 0 12px;font-weight:700;}

  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}

  .inp{display:flex;align-items:center;background:var(--panel-2);border:1px solid var(--hair-strong);
    border-radius:10px;transition:border-color .15s,box-shadow .15s;}
  .inp:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px rgba(184,114,10,.15);}
  .inp .suf{color:var(--ink-soft);font-size:13px;padding-right:12px;}
  .inp input,.inp select{flex:1;width:100%;min-width:0;border:0;background:transparent;color:var(--ink);
    font-size:16px;font-weight:600;padding:11px 12px;outline:none;font-variant-numeric:tabular-nums;}
  .inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .btn{appearance:none;border:0;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:700;
    cursor:pointer;background:var(--amber);color:#fff;transition:filter .12s;}
  @media (prefers-color-scheme:dark){.btn{color:#16130f;}}
  :root[data-theme="dark"] .btn{color:#16130f;}
  .btn:hover{filter:brightness(1.06);}
  .btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--hair-strong);}
  .btn.ghost:hover{border-color:var(--amber);color:var(--amber);filter:none;}
  .btn.block{width:100%;padding:14px;font-size:15px;margin-top:2px;}

  .loc-row{display:flex;gap:8px;align-items:stretch;}
  .loc-row .inp{flex:1;}

  .segs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .seg{appearance:none;border:1px solid var(--hair-strong);background:var(--panel-2);color:var(--ink);
    border-radius:9px;padding:10px 0;font-size:14px;font-weight:700;cursor:pointer;transition:all .12s;
    font-variant-numeric:tabular-nums;}
  .seg:hover{border-color:var(--amber);}
  .seg[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#fff;}
  @media (prefers-color-scheme:dark){.seg[aria-pressed="true"]{color:#16130f;}}
  :root[data-theme="dark"] .seg[aria-pressed="true"]{color:#16130f;}

  .notice{font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:14px;
    background:var(--go-soft);color:var(--ink);border:1px solid var(--hair);}
  .notice.warn{background:transparent;border-color:var(--warn);color:var(--warn);}
  .notice b{color:inherit;}

  .results{display:flex;flex-direction:column;gap:10px;}
  .station{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
    background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);}
  .station.best{border-color:var(--go);box-shadow:var(--shadow),0 0 0 1px var(--go);}
  .rank{font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;color:var(--ink-soft);
    width:22px;text-align:center;}
  .station.best .rank{color:var(--go);}
  .st-main .brand{font-weight:700;font-size:15px;}
  .st-main .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .st-main .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;
    text-transform:uppercase;color:var(--go);background:var(--go-soft);border-radius:20px;
    padding:2px 8px;margin-top:6px;}
  .dir{display:inline-block;margin-top:8px;margin-right:10px;font-size:13px;font-weight:600;
    color:var(--amber);text-decoration:none;}
  .dir:hover{text-decoration:underline;}
  .sec-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
    font-weight:700;margin:20px 0 2px;}
  .brand-row{display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;}
  .brand-row.best{border-color:var(--go);box-shadow:0 0 0 1px var(--go);}
  .brand-row .bn{font-size:13px;color:var(--ink);}
  .brand-row .bp{display:flex;align-items:center;gap:12px;}
  .brand-row .bp .p{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;}
  .brand-row.best .bp .p{color:var(--go);}
  .brand-row .dir{margin:0;font-size:16px;}
  .st-cost{text-align:right;}
  .st-cost .total{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;}
  .st-cost .delta{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:2px;}
  .station.best .st-cost .total{color:var(--go);}

  details.how{margin-top:6px;}
  details.how summary{cursor:pointer;font-size:13px;color:var(--amber);font-weight:600;}
  details.how p{font-size:13px;color:var(--ink-soft);}

  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:22px;line-height:1.6;}
  footer a{color:var(--amber);}
  #freshness{font-weight:600;margin-bottom:6px;}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;
    border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:6px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

<div class="wrap">
  <header>
    <div class="badge"><span class="dot"></span> Fill-Up</div>
    <h1>Cheapest forecourt by <em>true</em> cost</h1>
    <div class="tag">Pump price plus the fuel to drive there and back.</div>
  </header>

  <div class="readout">
    <div class="lbl">Best option</div>
    <div class="total" id="bestTotal">£0.00</div>
    <div class="where" id="bestWhere">Enter your details and search</div>
    <div class="sub" id="bestSub"></div>
  </div>

  <div class="card">
    <h2>Where are you?</h2>
    <div class="field">
      <label for="postcode">Postcode</label>
      <div class="loc-row">
        <div class="inp"><input id="postcode" type="text" inputmode="text" autocomplete="postal-code" placeholder="e.g. NG1 5FS"></div>
        <button class="btn ghost" id="useGps" type="button" title="Use my location">📍</button>
      </div>
    </div>
    <div class="field">
      <label for="radius">Search radius</label>
      <div class="inp"><input id="radius" type="number" inputmode="numeric" value="8" min="1" max="60" step="1"><span class="suf">miles</span></div>
    </div>
  </div>

  <div class="card">
    <h2>Your car</h2>
    <div class="row">
      <div class="field">
        <label for="mpg">Fuel economy</label>
        <div class="inp"><input id="mpg" type="number" inputmode="decimal" value="45" min="1" step="0.1"><span class="suf">mpg</span></div>
      </div>
      <div class="field">
        <label for="tank">Tank size</label>
        <div class="inp"><input id="tank" type="number" inputmode="decimal" value="50" min="1" step="0.5"><span class="suf">litres</span></div>
      </div>
    </div>
    <div class="field">
      <label for="fuel">Fuel type</label>
      <div class="inp"><select id="fuel">
        <option value="E10">Unleaded (E10)</option>
        <option value="E5">Super unleaded (E5)</option>
        <option value="B7">Diesel (B7)</option>
        <option value="B7P">Premium diesel</option>
      </select></div>
    </div>
    <div class="field">
      <label>How full is it now?</label>
      <div class="segs" role="group" aria-label="Current fuel level">
        <button class="seg" type="button" data-level="0">Empty</button>
        <button class="seg" type="button" data-level="25">¼</button>
        <button class="seg" type="button" data-level="50">½</button>
        <button class="seg" type="button" data-level="75">¾</button>
        <button class="seg" type="button" data-level="90">Nearly</button>
      </div>
    </div>
  </div>

  <button class="btn block" id="search" type="button">Find the cheapest fill-up</button>

  <div id="msg"></div>
  <div class="results" id="results"></div>

  <footer id="foot">
    <div id="freshness"></div>
    Prices from the UK Government <a href="https://www.fuel-finder.service.gov.uk" target="_blank" rel="noopener noreferrer">Fuel Finder</a> scheme.
    Distances are straight-line × 1.3 (road estimate). UK gallons.
  </footer>
</div>

<script>
  const LPG = 4.54609;          // litres per UK gallon
  const DETOUR = 1.3;           // straight-line -> road distance factor
  const $ = id => document.getElementById(id);
  const gbp = n => "£" + (isFinite(n) ? n : 0).toFixed(2);
  const label = s => {
    const brand = s.brand || "", place = s.name || s.postcode || "";
    if (!place) return brand;
    if (!brand) return place;
    return place.toLowerCase().includes(brand.toLowerCase()) ? place : `${brand} ${place}`;
  };

  let level = 25;
  let userLoc = null;
  let stations = [];
  let dataNote = "";
  let dataGeneratedAt = null;

  const SAMPLE = {
    generated_at: "sample",
    stations: [
      {brand:"Costco", name:"Nottingham", postcode:"NG7 2PZ", lat:52.902, lng:-1.190, prices:{E10:137.9,E5:150.9,B7:145.9}},
      {brand:"Tesco", name:"Extra Toton", postcode:"NG9 6GT", lat:52.917, lng:-1.260, prices:{E10:139.9,E5:152.9,B7:147.9}},
      {brand:"Asda", name:"Hyson Green", postcode:"NG7 5PU", lat:52.966, lng:-1.170, prices:{E10:140.9,E5:0,B7:148.9}},
      {brand:"Morrisons", name:"Netherfield", postcode:"NG4 2PD", lat:52.960, lng:-1.080, prices:{E10:141.4,E5:154.4,B7:149.4}},
      {brand:"Sainsbury's", name:"Castle Marina", postcode:"NG7 1GX", lat:52.939, lng:-1.165, prices:{E10:141.9,E5:154.9,B7:148.9}},
      {brand:"Esso", name:"Radford Rd", postcode:"NG7 5DR", lat:52.963, lng:-1.180, prices:{E10:146.9,E5:159.9,B7:153.9}},
      {brand:"BP", name:"Nottingham Rd", postcode:"NG6 0DW", lat:52.995, lng:-1.150, prices:{E10:145.9,E5:158.9,B7:152.9}},
      {brand:"Shell", name:"Mansfield Rd", postcode:"NG5 2EF", lat:52.985, lng:-1.150, prices:{E10:147.9,E5:160.9,B7:154.9}}
    ]
  };

  document.querySelectorAll(".seg").forEach(b => b.addEventListener("click", () => {
    level = parseInt(b.dataset.level, 10);
    document.querySelectorAll(".seg").forEach(x =>
      x.setAttribute("aria-pressed", String(x === b)));
  }));
  document.querySelector('.seg[data-level="25"]').setAttribute("aria-pressed","true");

  function num(el){ const v = parseFloat(el.value); return isFinite(v) && v >= 0 ? v : 0; }
  function haversine(a, b){
    const R = 3958.8, toR = d => d*Math.PI/180;
    const dLat = toR(b.lat-a.lat), dLng = toR(b.lng-a.lng);
    const s = Math.sin(dLat/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
  }
  function setMsg(html, warn){
    $("msg").innerHTML = html ? `<div class="notice${warn?' warn':''}">${html}</div>` : "";
  }

  async function loadStations(){
    if (stations.length) return;
    try {
      const r = await fetch("data/prices.json", {cache:"no-store"});
      if (!r.ok) throw 0;
      const d = await r.json();
      stations = d.stations || [];
      if (!stations.length) throw 0;
      dataGeneratedAt = d.generated_at || null;
      dataNote = "";
    } catch {
      stations = SAMPLE.stations;
      dataGeneratedAt = "sample";
      dataNote = "Showing <b>sample prices</b> — live data appears once the Fuel Finder fetcher is set up.";
    }
  }

  function showFreshness(){
    const el = $("freshness");
    if (!el) return;
    if (!dataGeneratedAt || dataGeneratedAt === "sample"){ el.textContent = ""; return; }
    const then = new Date(dataGeneratedAt).getTime();
    if (!isFinite(then)){ el.textContent = ""; return; }
    const mins = Math.max(0, Math.round((Date.now() - then) / 60000));
    let ago;
    if (mins < 1) ago = "just now";
    else if (mins < 60) ago = mins + "m ago";
    else { const h = Math.floor(mins/60), m = mins % 60; ago = h + "h" + (m ? " " + m + "m" : "") + " ago"; }
    el.textContent = "Prices updated " + ago;
  }

  async function geocodePostcode(pc){
    const r = await fetch("https://api.postcodes.io/postcodes/" + encodeURIComponent(pc.trim()));
    if (!r.ok) throw new Error("Postcode not found — check it and try again.");
    const d = await r.json();
    return {lat:d.result.latitude, lng:d.result.longitude, label:d.result.postcode};
  }

  $("useGps").addEventListener("click", () => {
    if (!navigator.geolocation){ setMsg("Your browser can't share location — type a postcode instead.", true); return; }
    $("useGps").textContent = "…";
    navigator.geolocation.getCurrentPosition(
      p => { userLoc = {lat:p.coords.latitude, lng:p.coords.longitude, label:"your location"};
             $("useGps").textContent = "✓"; $("postcode").value = ""; run(); },
      () => { $("useGps").textContent = "📍"; setMsg("Couldn't get your location — type a postcode instead.", true); },
      {enableHighAccuracy:true, timeout:8000}
    );
  });

  $("search").addEventListener("click", run);
  $("postcode").addEventListener("keydown", e => { if (e.key === "Enter") run(); });

  async function run(){
    const btn = $("search");
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Searching…';
    try {
      const pc = $("postcode").value.trim();
      if (pc) userLoc = await geocodePostcode(pc);
      if (!userLoc){ setMsg("Enter a postcode or tap 📍 to use your location.", true); return; }

      await loadStations();

      const fuel = $("fuel").value;
      const mpg = num($("mpg")), tank = num($("tank")), radius = num($("radius")) || 8;
      const litresFill = tank * (1 - level/100);

      const rows = stations.map(s => {
        const price = s.prices ? s.prices[fuel] : 0;
        if (!price || price <= 0) return null;
        const dist = haversine(userLoc, {lat:s.lat, lng:s.lng});
        if (dist > radius) return null;
        const roundTrip = dist * 2 * DETOUR;
        const fillCost = litresFill * price/100;
        const tripLitres = mpg > 0 ? roundTrip/mpg * LPG : 0;
        const tripCost = tripLitres * price/100;
        return {s, price, dist, fillCost, tripCost, total: fillCost + tripCost};
      }).filter(Boolean).sort((a,b) => a.total - b.total);

      render(rows, {fuel, litresFill, radius});
    } catch(e){
      setMsg(e.message || "Something went wrong — try again.", true);
    } finally {
      btn.disabled = false; btn.textContent = "Find the cheapest fill-up";
    }
  }

  function render(rows, ctx){
    const res = $("results");
    if (!rows.length){
      setMsg("No forecourts with " + ctx.fuel + " prices within that radius. Try a bigger radius.", true);
      res.innerHTML = "";
      $("bestTotal").textContent = "£0.00";
      $("bestWhere").textContent = "No results"; $("bestSub").textContent = "";
      return;
    }
    setMsg(dataNote, dataNote.includes("sample"));
    showFreshness();

    const best = rows[0];
    const cheapestPump = [...rows].sort((a,b)=>a.price-b.price)[0];
    $("bestTotal").textContent = gbp(best.total);
    $("bestWhere").textContent = label(best.s);
    $("bestSub").textContent =
      `${ctx.litresFill.toFixed(1)} L @ ${best.price.toFixed(1)}p · ${best.dist.toFixed(1)} mi away · fill ${gbp(best.fillCost)} + trip ${gbp(best.tripCost)}`;

    res.innerHTML = "";

    if (cheapestPump !== best){
      const n = document.createElement("div");
      n.className = "notice";
      n.innerHTML = `<b>${label(cheapestPump.s)}</b> has the lowest pump price (${cheapestPump.price.toFixed(1)}p) but it's ${cheapestPump.dist.toFixed(1)} mi away — once you count the drive, <b>${label(best.s)}</b> works out cheaper.`;
      res.appendChild(n);
    }

    const shown = rows.slice(0, 15);
    shown.forEach((r, i) => {
      const el = document.createElement("div");
      el.className = "station" + (i === 0 ? " best" : "");
      const delta = r.total - best.total;
      el.innerHTML =
        `<div class="rank">${i+1}</div>
         <div class="st-main">
           <div class="brand"></div>
           <div class="meta"></div>
           <a class="dir" target="_blank" rel="noopener noreferrer">🧭 Directions</a>
           ${i===0 ? '<span class="pill">Best value</span>' : ''}
         </div>
         <div class="st-cost">
           <div class="total">${gbp(r.total)}</div>
           <div class="delta">${i===0 ? 'cheapest' : '+'+gbp(delta).slice(1)}</div>
         </div>`;
      el.querySelector(".brand").textContent = label(r.s);
      el.querySelector(".meta").textContent =
        `${r.price.toFixed(1)}p/L · ${r.dist.toFixed(1)} mi · fill ${gbp(r.fillCost)} + trip ${gbp(r.tripCost)}`;
      el.querySelector(".dir").href =
        `https://www.google.com/maps/dir/?api=1&destination=${r.s.lat},${r.s.lng}&travelmode=driving`;
      res.appendChild(el);
    });

    if (rows.length > shown.length){
      const more = document.createElement("div");
      more.className = "notice";
      more.textContent = `Showing the ${shown.length} best-value of ${rows.length} within ${ctx.radius} miles — lower the radius for fewer, closer results.`;
      res.appendChild(more);
    }

    // cheapest by TRUE COST per brand, split into two lists: supermarkets vs fuel brands
    const SUPERMARKETS = ["tesco","asda","sainsbury","morrison","costco","booths","waitrose"];
    const isSupermarket = b => { const x = (b||"").toLowerCase(); return SUPERMARKETS.some(k => x.includes(k)); };

    const brandMap = new Map();
    for (const r of rows){
      const b = r.s.brand || "Other";
      let e = brandMap.get(b);
      if (!e){ e = {brand:b, count:0, best:r}; brandMap.set(b, e); }
      e.count++;
      if (r.total < e.best.total) e.best = r;
    }
    const brands = [...brandMap.values()].sort((a,b) => a.best.total - b.best.total);

    function brandSection(title, list){
      if (!list.length) return;
      const bt = document.createElement("h3");
      bt.className = "sec-title";
      bt.textContent = title;
      res.appendChild(bt);
      list.forEach((e, i) => {
        const row = document.createElement("div");
        row.className = "brand-row" + (i === 0 ? " best" : "");
        row.innerHTML =
          `<div class="bn"></div>
           <div class="bp"><span class="p">${gbp(e.best.total)}</span>
             <a class="dir" target="_blank" rel="noopener noreferrer" title="Directions to best-value branch">🧭</a></div>`;
        row.querySelector(".bn").textContent =
          `${e.brand} · ${e.best.price.toFixed(1)}p · ${e.count} nearby · ${e.best.dist.toFixed(1)} mi`;
        row.querySelector(".dir").href =
          `https://www.google.com/maps/dir/?api=1&destination=${e.best.s.lat},${e.best.s.lng}&travelmode=driving`;
        res.appendChild(row);
      });
    }

    brandSection("Supermarkets", brands.filter(e => isSupermarket(e.brand)));
    brandSection("Fuel brands", brands.filter(e => !isSupermarket(e.brand)));

    const how = document.createElement("details");
    how.className = "how";
    how.innerHTML = `<summary>How is "true cost" worked out?</summary>
      <p>Fill cost = litres needed to top up × pump price. Trip cost = the fuel you burn driving there and back
      (distance ÷ your mpg × pump price). True cost is the two added together, so a cheap-but-far station is
      judged fairly against a dearer one nearby.</p>`;
    res.appendChild(how);
  }

  // Remember your car on THIS device only. Saved in your browser's localStorage —
  // never uploaded, never in the repo, invisible to anyone else who visits the site.
  const CAR_KEY = "fillup_car_v1";
  try {
    const c = JSON.parse(localStorage.getItem(CAR_KEY) || "null");
    if (c) {
      if (c.mpg)  $("mpg").value  = c.mpg;
      if (c.tank) $("tank").value = c.tank;
      if (c.fuel) $("fuel").value = c.fuel;
    }
  } catch {}
  ["mpg","tank","fuel"].forEach(id => $(id).addEventListener("change", () => {
    try {
      localStorage.setItem(CAR_KEY, JSON.stringify({
        mpg: $("mpg").value, tank: $("tank").value, fuel: $("fuel").value
      }));
    } catch {}
  }));

  // On load, fetch the data once so the footer can show how fresh the prices are.
  loadStations().then(showFreshness);
</script>
