name: Update fuel prices

# Fetches the latest prices from Fuel Finder and commits data/prices.json.
# Runs on a schedule and can be triggered manually from the Actions tab.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay a few min)
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to commit prices.json back to the repo

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch prices
        env:
          FF_CLIENT_ID: ${{ secrets.FF_CLIENT_ID }}
          FF_CLIENT_SECRET: ${{ secrets.FF_CLIENT_SECRET }}
        run: node scripts/build-prices.mjs

      - name: Commit if changed
        run: |
          git config user.name  "fuel-price-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/prices.json)" ]; then
            git add data/prices.json
            git commit -m "chore: update fuel prices"
            git push
          else
            echo "No price changes."
          fi
